<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>غَرْس — صقل الشخصية</title>
<meta name="description" content="حوّل صفات قدوتك إلى عادات دائمة، صفة كل يوم.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="غَرْس">
<meta name="theme-color" content="#131f19">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Reem+Kufi:wght@400;500;700&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{ color-scheme: dark; }
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family:'Cairo', 'Tahoma', sans-serif;
  background: radial-gradient(circle at 30% 0%, #1c2b22 0%, #101a15 60%, #0c1410 100%);
  min-height:100vh;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}
#app-root{ width:100%; min-height:100vh; display:flex; justify-content:center; }
.ghars-phone{
  width:100%; max-width:460px; min-height:100vh;
  display:flex; flex-direction:column; background:#131f19; position:relative;
}
.ghars-header{ padding:22px 20px 14px; border-bottom:1px solid rgba(237,230,211,0.08); }
.ghars-header-top{ display:flex; align-items:center; justify-content:space-between; }
.ghars-brand{ display:flex; align-items:center; gap:8px; font-family:'Aref Ruqaa', serif; font-size:26px; font-weight:700; color:#EDE6D3; }
.ghars-cycle-badge{ font-family:'Reem Kufi', sans-serif; font-size:12px; color:#C9A24B; border:1px solid rgba(201,162,75,0.4); padding:4px 12px; border-radius:20px; }
.ghars-header-sub{ margin-top:6px; font-size:12.5px; color:#9CA898; font-family:'Reem Kufi', sans-serif; letter-spacing:.3px; }

#content{ flex:1; overflow:hidden; display:flex; flex-direction:column; }
.ghars-scroll{ flex:1; overflow-y:auto; padding:16px 16px 90px; }

.ghars-section{ margin-bottom:18px; }
.ghars-section-title{ display:flex; align-items:baseline; gap:8px; font-family:'Reem Kufi', sans-serif; font-size:14px; font-weight:600; color:#EDE6D3; margin-bottom:8px; }
.ghars-section-sub{ font-size:11px; color:#7d8a76; font-weight:400; }

.ghars-cards{ display:flex; flex-direction:column; gap:10px; }
.ghars-card{
  display:flex; align-items:flex-start; gap:10px;
  background:linear-gradient(155deg,#1b2a21,#17231b);
  border:1px solid rgba(237,230,211,0.07);
  border-right:3px solid var(--tier-color,#6B8F5A);
  border-radius:14px; padding:12px 14px;
}
.ghars-card.done{ opacity:.62; }
.ghars-card.wilting{ border-right-color:#a98c4b; }
.ghars-card-placeholder{ width:100%; justify-content:center; align-items:center; gap:8px; color:#7d8a76; border:1px dashed rgba(237,230,211,0.18); background:none; cursor:pointer; font-size:13px; font-family:'Cairo'; }
.ghars-card-check{ width:26px; height:26px; border-radius:50%; flex-shrink:0; margin-top:2px; border:2px solid var(--tier-color,#6B8F5A); background:transparent; color:#0c1410; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
.ghars-card.done .ghars-card-check{ background:var(--tier-color,#6B8F5A); }
.ghars-card-body{ flex:1; cursor:pointer; min-width:0; }
.ghars-card-name{ font-size:15px; font-weight:600; color:#EDE6D3; margin-bottom:3px; }
.ghars-card-meta{ display:flex; align-items:center; gap:8px; margin-bottom:4px; flex-wrap:wrap; }
.ghars-chip{ font-size:10.5px; color:#B9C4AC; background:rgba(107,143,90,0.18); padding:2px 8px; border-radius:20px; }
.ghars-day-count{ font-size:11px; color:#7d8a76; font-family:'Reem Kufi', sans-serif; }
.ghars-card-task{ font-size:12.5px; color:#9CA898; line-height:1.5; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; }

.ghars-empty{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; padding:40px 20px; color:#EDE6D3; }
.ghars-empty-title{ font-family:'Aref Ruqaa', serif; font-size:19px; }
.ghars-empty-desc{ font-size:13px; color:#9CA898; max-width:260px; }

.ghars-btn-primary{
  background:linear-gradient(135deg,#6B8F5A,#557248); color:#EDFBE9; border:none; border-radius:12px;
  padding:11px 18px; font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center;
  gap:6px; cursor:pointer; font-family:'Cairo'; box-shadow:0 4px 14px rgba(107,143,90,0.28);
}
.ghars-add-btn{ width:100%; margin-bottom:14px; }

#nav{ display:flex; border-top:1px solid rgba(237,230,211,0.08); background:#101b15; position:sticky; bottom:0; }
.ghars-nav-btn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 0 12px; background:none; border:none; color:#7d8a76; font-size:11px; font-family:'Cairo'; cursor:pointer; }
.ghars-nav-btn.active{ color:#C9A24B; }

.ghars-modal-overlay{ position:fixed; inset:0; background:rgba(8,12,9,0.72); display:flex; align-items:flex-end; justify-content:center; z-index:50; backdrop-filter:blur(2px); }
.ghars-modal{ width:100%; max-width:460px; background:#182419; border-radius:22px 22px 0 0; padding:24px 20px 28px; max-height:86vh; overflow-y:auto; position:relative; animation:ghars-slide-up .25s ease; }
.ghars-page{ background:linear-gradient(180deg,#1b2b1f,#172018); border-top:1px solid rgba(201,162,75,0.25); }
@keyframes ghars-slide-up{ from{ transform:translateY(30px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
.ghars-modal-close{ position:absolute; top:16px; left:16px; background:rgba(237,230,211,0.08); border:none; color:#EDE6D3; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.ghars-modal-tier{ font-family:'Reem Kufi', sans-serif; font-size:12px; margin-bottom:6px; }
.ghars-modal-title{ font-family:'Aref Ruqaa', serif; font-size:24px; color:#EDE6D3; margin:0 0 2px; }
.ghars-modal-branch{ font-size:12px; color:#9CA898; margin-bottom:16px; }

.ghars-quote-box{ display:flex; gap:8px; background:#EDE6D3; color:#2b3626; border-radius:14px; padding:14px; margin-bottom:12px; font-family:'Aref Ruqaa', serif; font-size:15px; line-height:1.7; }
.ghars-quote-box p{ margin:0; }
.ghars-task-box{ background:rgba(107,143,90,0.14); border-radius:14px; padding:12px 14px; margin-bottom:16px; }
.ghars-task-label{ font-size:11px; color:#8fb37c; font-family:'Reem Kufi'; margin-bottom:4px; }
.ghars-task-box p{ margin:0; font-size:13.5px; color:#EDE6D3; line-height:1.6; }

.ghars-done-btn{ width:100%; padding:13px; border-radius:14px; border:1.5px solid rgba(107,143,90,0.5); background:transparent; color:#B9C4AC; font-size:14px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; margin-bottom:16px; font-family:'Cairo'; }
.ghars-done-btn.done{ background:linear-gradient(135deg,#6B8F5A,#557248); color:#EDFBE9; border-color:transparent; }

.ghars-rate-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; font-size:13px; color:#9CA898; }
.ghars-stars{ display:flex; gap:2px; }
.ghars-stars button{ background:none; border:none; padding:2px; cursor:pointer; }

.ghars-note-input{ width:100%; background:rgba(237,230,211,0.06); border:1px solid rgba(237,230,211,0.12); border-radius:12px; padding:10px 12px; color:#EDE6D3; font-size:13px; font-family:'Cairo'; resize:none; box-sizing:border-box; }
.ghars-note-input::placeholder{ color:#6b7566; }

.ghars-streak-pill{ margin-top:12px; display:inline-flex; align-items:center; gap:5px; background:rgba(201,162,75,0.16); color:#C9A24B; font-size:12px; padding:5px 12px; border-radius:20px; }

.ghars-tree-canvas{ background:radial-gradient(circle at 50% 30%,#182a1d 0%,#0f1812 80%); border-radius:20px; padding:10px 0 0; margin-bottom:14px; }
.ghars-tree-stats{ display:flex; justify-content:space-around; margin-bottom:18px; }
.ghars-stat{ text-align:center; }
.ghars-stat .n{ font-family:'Aref Ruqaa', serif; font-size:22px; color:#EDE6D3; }
.ghars-stat .l{ font-size:10.5px; color:#7d8a76; margin-top:2px; }

.ghars-branch-list{ display:flex; flex-direction:column; gap:8px; }
.ghars-branch-row{ display:flex; align-items:center; gap:8px; background:rgba(237,230,211,0.04); border-radius:12px; padding:9px 12px; font-size:13px; color:#EDE6D3; }
.ghars-branch-dot{ width:9px; height:9px; border-radius:50%; background:#6B8F5A; flex-shrink:0; }
.ghars-branch-dot.wilt{ background:#a98c4b; }
.ghars-branch-name{ flex:1; }
.ghars-branch-leaves,.ghars-branch-fruits{ display:flex; align-items:center; gap:3px; font-size:12px; color:#9CA898; }

.ghars-traits-topbar{ margin-bottom:12px; }
.ghars-progress-track{ height:6px; background:rgba(237,230,211,0.08); border-radius:6px; overflow:hidden; }
.ghars-progress-fill{ height:100%; background:linear-gradient(90deg,#6B8F5A,#C9A24B); }
.ghars-progress-label{ font-size:11px; color:#7d8a76; margin-top:5px; font-family:'Reem Kufi'; }

.ghars-filter-row{ display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
.ghars-filter-chip{ background:rgba(237,230,211,0.06); border:1px solid rgba(237,230,211,0.1); color:#9CA898; font-size:12px; padding:6px 13px; border-radius:20px; cursor:pointer; font-family:'Cairo'; }
.ghars-filter-chip.active{ background:#6B8F5A; color:#fff; border-color:transparent; }

.ghars-traits-list{ display:flex; flex-direction:column; gap:8px; }
.ghars-trait-row{ display:flex; align-items:center; gap:10px; background:rgba(237,230,211,0.04); border-radius:12px; padding:10px 12px; }
.ghars-tier-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.ghars-trait-info{ flex:1; min-width:0; }
.ghars-trait-name{ font-size:14px; color:#EDE6D3; font-weight:600; }
.ghars-trait-sub{ font-size:11px; color:#7d8a76; margin-top:1px; }
.ghars-icon-btn{ background:rgba(237,230,211,0.06); border:none; color:#9CA898; width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
.ghars-icon-btn.danger:hover{ color:#d97757; }

.ghars-code-box{ font-family:monospace; font-size:11px; direction:ltr; text-align:left; word-break:break-all; line-height:1.5; }
.ghars-btn-warn{ background:rgba(217,119,87,0.14); color:#e2a084; border:1.5px solid rgba(217,119,87,0.4); border-radius:12px; padding:11px 18px; font-size:13.5px; font-weight:700; cursor:pointer; font-family:'Cairo'; }
.ghars-btn-outline{ background:transparent; color:#B9C4AC; border:1.5px solid rgba(237,230,211,0.18); border-radius:12px; padding:10px 16px; font-size:13px; font-weight:600; cursor:pointer; font-family:'Cairo'; display:flex; align-items:center; justify-content:center; gap:6px; }
.ghars-sync-status{ font-size:12.5px; color:#9CA898; background:rgba(237,230,211,0.05); border-radius:10px; padding:8px 12px; }
.ghars-sync-status.on{ color:#8fb37c; background:rgba(107,143,90,0.12); }

.ghars-field-label{ display:block; font-size:11.5px; color:#8fb37c; font-family:'Reem Kufi'; margin:12px 0 6px; }
.ghars-input{ width:100%; background:rgba(237,230,211,0.06); border:1px solid rgba(237,230,211,0.14); border-radius:11px; padding:10px 12px; color:#EDE6D3; font-size:13.5px; font-family:'Cairo'; box-sizing:border-box; }
.ghars-tier-picker{ display:flex; gap:8px; }
.ghars-tier-pick{ flex:1; padding:9px 4px; border-radius:11px; border:1.5px solid rgba(237,230,211,0.14); background:transparent; color:#9CA898; font-size:12px; cursor:pointer; font-family:'Cairo'; }
.ghars-tier-pick.active{ border-color:var(--tc); color:#EDE6D3; background:color-mix(in srgb, var(--tc) 18%, transparent); }

.ghars-museum-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.ghars-museum-card{ background:linear-gradient(155deg,#1b2a21,#17231b); border:1px solid rgba(201,162,75,0.2); border-radius:16px; padding:16px 12px; text-align:center; }
.ghars-museum-fruit{ font-size:28px; margin-bottom:6px; }
.ghars-museum-name{ font-size:13.5px; color:#EDE6D3; font-weight:700; }
.ghars-museum-branch{ font-size:11px; color:#9CA898; margin:2px 0 6px; }
.ghars-museum-count{ font-size:10.5px; color:#C9A24B; }

#toast{ position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(20px); background:#EDE6D3; color:#22301F; padding:9px 18px; border-radius:20px; font-size:13px; font-weight:600; z-index:60; box-shadow:0 6px 18px rgba(0,0,0,0.3); opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; }
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

@media (max-width:400px){ .ghars-phone{ max-width:100%; } }
</style>
</head>
<body>
<div id="app-root">
  <div class="ghars-phone">
    <div id="header" class="ghars-header"></div>
    <div id="content"></div>
    <div id="nav"></div>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast"></div>
<script src="./app.js"></script>
</body>
</html>
